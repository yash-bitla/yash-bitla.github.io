{% extends "base.html" %}
{% block title %}{{ post.title }} · {{ site.name }}{% endblock %}
{% block description %}{{ post.summary }}{% endblock %}
{% block content %}
<article class="post">
  <header>
    <h1>{{ post.title }}</h1>
    <time datetime="{{ post.date.isoformat() }}">{{ post.date.strftime("%B %-d, %Y") }}</time>
  </header>
  {{ post.html }}
</article>
<p class="back"><a href="/writing/">All posts</a></p>
{% endblock %}
