<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  {% if posts %}<link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="/feed.xml">{% endif %}
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/">{{ site.name }}</a>
    <nav>
      <a href="/#experience">Experience</a>
      <a href="/#projects">Projects</a>
      {% if posts %}<a href="/blog/">Blog</a>{% endif %}
      <a href="/#contact">Contact</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>{{ site.name }}</span>
    <span>
      {% for link in site.links %}<a href="{{ link.url }}">{{ link.label }}</a>{% endfor %}
      <a href="mailto:{{ site.email }}">Email</a>
    </span>
  </footer>
</body>
</html>
